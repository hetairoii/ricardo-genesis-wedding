name: Bug
description: Reportar algo que no funciona como debería
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: ¿Qué está fallando?
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: areas
    attributes:
      label: Archivos o áreas involucradas
      description: Opcional, si ya se conocen.
    validations:
      required: false
